<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container {
            background-color: blue;
            display: flex;
            flex-flow: row nowrap;
        }
        div.item {
            background-color: lightblue;
            border:1px solid black;
            text-align: center;
            flex-basis: auto;
            margin: 3px;
            padding: 3px;
        }
    </style>
    
    
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">Este é um novo conteúdo</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">me. I am Mariah</div>
        <div class="item">F</div>
        <div class="item">Brenda é uma gata</div>

    </div>
    
</body>
</html>
