<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container {
            background-color: blue;
            display: flex;
            flex-flow: row nowrap;
        }
        div.item {
            background-color: lightblue;
            border:1px solid black;
            text-align: center;
        }

        div#cxa {
            flex-shrink: 0;
            flex-grow: 0; 
            background-color: gray;
            color: white; 
            flex-basis: 200px;
        }
        div#cxb {
            flex-shrink: 1;
            flex-grow: 1;
            background-color: darkred;
            color: white;
            flex-basis: 200px;
        }
        div#cxc {
           
            background-color: darkblue;
            color: white;
            /*propriedade flex, short-hand aconselhada pela W3C*/
            flex: 2 0 200px;
        }
    </style>
    
    
</head>
<body>
    <div class="container">
        <div class="item" id="cxa">A</div>
        <div class="item" id="cxb">B</div>
        <div class="item" id="cxc">C</div>

    </div>
    
</body>
</html>
